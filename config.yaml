# Goose Configuration for BASEDATA Pipeline Builder
#
# Copy this to ~/.config/goose/config.yaml
# Or run: cp config.yaml ~/.config/goose/config.yaml
#
# Also copy the custom provider:
#   mkdir -p ~/.config/goose/custom_providers
#   cp custom_providers/pnnl.json ~/.config/goose/custom_providers/

GOOSE_PROVIDER: pnnl
GOOSE_MODEL: claude-sonnet-4-20250514

extensions:
  # Built-in developer tools (file operations, shell, etc.)
  developer:
    enabled: true
    name: developer
    type: builtin
  
  # DSAGT MCP server
  dsagt:
    enabled: true
    name: dsagt
    type: stdio
    cmd: dsagt-pipeline-server
    args:
      - --registry
      - /path/to/dsagt/registry.yaml  # UPDATE THIS PATH
    timeout: 300
