# DSAGT Default Tool Registry
#
# Each tool entry defines:
#   name: Unique identifier for the tool
#   description: What the tool does (shown to agents)
#   executable: Command to run (can include interpreter)
#   parameters: Input schema for the tool
#
# Parameter fields:
#   type: string | integer | number | boolean | array | object
#   required: true | false (default: false)
#   default: Default value if not provided
#   description: Help text for the parameter

tools:
  - name: scan_directory
    description: >-
      Scan a data directory and produce a structured report: total size,
      file counts by extension, largest files, and directory tree with sizes.
      Use this to assess a dataset before building a processing pipeline.
    executable: python tools/scan_directory.py
    parameters:
      directory:
        type: string
        required: true
        description: Path to directory to scan
      max_depth:
        type: integer
        default: 5
        description: Maximum directory depth to traverse
      top_n:
        type: integer
        default: 20
        description: Number of largest files to list