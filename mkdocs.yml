site_name: DSAgt
site_description: DataSmith Agent — AI-assisted data pipeline builder
site_url: https://ai-modcon.github.io/dsagt
repo_url: https://github.com/AI-ModCon/dsagt
repo_name: AI-ModCon/dsagt
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Architecture: architecture.md
  - Capabilities:
    - Provenance: provenance.md
    - Knowledge Base: knowledge-base.md
    - Skills: skills.md
    - Memory: memory.md
    - Observability: observability.md
  - MCP Servers: mcp-servers.md
  - CLI Reference: cli.md
  - Use Cases:
    - Overview: use-cases/index.md
    - Microbial Isolates: use-cases/microbial-isolates.md
    - Cryo-EM: use-cases/cryoem.md
    - VASP / ISAAC: use-cases/vasp.md
  - Developer Guide: developer.md
