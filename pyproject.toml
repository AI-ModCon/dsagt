[project]
name = "dsagt"
dynamic = ["version"]
description = "DataSmith Agent - AI-assisted data pipeline builder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "BASE-DATA Team", email = "aaron.tuor@pnnl.gov"}
]
keywords = ["data", "pipeline", "agent", "mcp", "ai"]

dependencies = [
    # Core
    "pyyaml>=6.0",                      # config & tool-spec parsing
    "httpx>=0.27.0",                    # HTTP client; API embeddings
    "questionary>=2.0",                 # interactive `dsagt init` select/checkbox menus
    "mcp>=2.0.0,<3.0.0",               # MCP server protocol
    "jsonschema>=4.0",                 # tool-argument validation in the dispatch shell
    "mlflow==3.11.1",                  # trace store & observability
    # Knowledge base
    # torch 2.2.2 (latest available for Intel Mac) was compiled against NumPy 1.x
    # and fails to import with NumPy 2.x, so cap numpy on that platform only.
    "numpy>=1.26,<2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "llama-index-core>=0.11",          # document & code chunking
    "llama-index-readers-file>=0.1",   # SimpleDirectoryReader file readers
    "tree-sitter-language-pack>=0.2,<1.6",  # code-aware chunking (1.6+ rewrite breaks CodeSplitter)
    "chromadb>=1.5.1",                 # vector store
    "sentence-transformers==5.4.0",    # local embeddings & reranking
    "transformers==4.47.0",            # pin for sentence-transformers
    "rank-bm25>=0.2.2",                # sparse keyword retrieval
    "ruyaml>=0.91.0",
]

[project.scripts]
dsagt = "dsagt.commands.cli:main"
dsagt-run = "dsagt.commands.run_code:main"
dsagt-server = "dsagt.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black==26.5.1",
    "ruff==0.15.20",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=6.0",
]

[project.optional-dependencies]
fix-certificates = ["truststore>=0.10.4"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "dsagt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsagt = ["py.typed", "codes/**/*", "skills/**/*", "dsagt_instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: tests that hit real APIs or start real subprocesses (deselect with -m 'not integration')",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# E402 (imports not at top) is intentional in these modules: __init__.py sets
# OpenMP/SSL env vars that must be in place before heavy libs import;
# knowledge.py defers embedding-backend imports; the integration tests guard
# their imports behind a credentials/skip check.
"src/dsagt/__init__.py" = ["E402"]
"src/dsagt/knowledge.py" = ["E402"]
"tests/test_knowledge_integration.py" = ["E402"]
"tests/test_dependency_integration.py" = ["E402"]
