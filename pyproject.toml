[project]
name = "dsagt"
version = "0.1.0"
description = "DataSmith Agent - AI-assisted data pipeline builder"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "TBD"}
authors = [
    {name = "BASE-DATA Team", email = "aaron.tuor@pnnl.gov"}
]
keywords = ["data", "pipeline", "agent", "mcp", "ai"]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    # LLM proxy + observability (used by dsagt-proxy and dsagt start)
    "litellm[proxy]>=1.83.7",  # floor: closes GHSA-r75f / GHSA-v4p8 / GHSA-xqmj — don't downgrade
    "python-dotenv>=1.0",  # transitive via litellm, pinned directly so a fresh venv always has it

    "mlflow>=3.11.0,<4.0",  # pinned: observability.py relies on mlflow.tracing APIs (start_span, update_current_trace, _get_tracer)
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # Knowledge base
    "numpy>=1.26",
    "llama-index-core>=0.11",
    "tree-sitter-language-pack>=0.2",
    "chromadb>=1.5.1",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]

[project.scripts]
dsagt = "dsagt.commands.cli:main"
dsagt-proxy = "dsagt.commands.proxy_server:main"
dsagt-run = "dsagt.commands.run_tool:main"
dsagt-registry-server = "dsagt.commands.registry_server:main"
dsagt-knowledge-server = "dsagt.commands.knowledge_server:main"
dsagt-setup-kb = "dsagt.commands.setup_core_kb:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsagt = ["py.typed", "tools/*.md", "tools/*.py", "skills/**/*", "dsagt_instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: tests that hit real APIs or start real subprocesses (deselect with -m 'not integration')",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
