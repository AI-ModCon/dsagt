[project]
name = "dsagt"
dynamic = ["version"]
description = "DataSmith Agent - AI-assisted data pipeline builder"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "TBD"}
authors = [
    {name = "BASE-DATA Team", email = "aaron.tuor@pnnl.gov"}
]
keywords = ["data", "pipeline", "agent", "mcp", "ai"]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    # LiteLLM is used by MCP servers (knowledge: embeddings),
    # session.run_extraction (memory extraction LLM call), and Phase 2
    # ``dsagt start --enable-proxy`` (LiteLLM proxy server bootstrap).
    # The ``[proxy]`` extra pulls in backoff / fastapi / uvicorn / ...
    # required by ``litellm.proxy.proxy_cli.run_server``.
    "litellm[proxy]>=1.83.7",  # floor: closes GHSA-r75f / GHSA-v4p8 / GHSA-xqmj — don't downgrade
    "python-dotenv>=1.0",  # transitive via litellm, pinned directly so a fresh venv always has it
    # MCP-server / dsagt-run observability emits OTLP HTTP to MLflow's
    # /v1/traces endpoint; floor=3.11.1 so we ship with the latest GenAI
    # semconv support and well past the 3.6.0 protobuf-response bug fixed
    # in 3.7.0.  The proxy-side (_DSAGTMlflowLogger in provenance.py) still
    # uses MLflow's MlflowLogger SDK directly, so MLflow remains a hard dep.
    "mlflow>=3.11.1,<4.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # Knowledge base
    "numpy>=1.26",
    "llama-index-core>=0.11",
    "tree-sitter-language-pack>=0.2",
    "chromadb>=1.5.1",
    "faiss-cpu>=1.8",
    "sentence-transformers==5.4.0",
    "transformers==4.47.0",
    "llama-index-readers-file>=0.1",
    # Sparse keyword retrieval for hybrid search.  rank_bm25 is pure Python
    # (~10 KB), no native deps; the corpus and IDF stats live in memory and
    # are pickled to disk per-collection.  Used alongside dense embeddings
    # via Reciprocal Rank Fusion in KnowledgeBase.search when the route's
    # ``hybrid`` flag is set (default True).
    "rank-bm25>=0.2.2",
    # csvkit ships ~14 well-behaved CSV CLI tools (csvcut, csvgrep,
    # csvstat, csvjson, csvlook, ...).  Used by the README quickstart's
    # CSV-summary prompts.  Replaces the previous ``csvtool`` dep, which
    # had inverted exit codes (returned True/False from main(), then
    # sys.exit(main()) so every successful run exited 1) — that broke
    # agent error-detection on every csvtool call.
    "csvkit>=2.2.0",
    "h5py>=3.16.0",
]

[project.scripts]
dsagt = "dsagt.commands.cli:main"
dsagt-run = "dsagt.commands.run_tool:main"
dsagt-proxy = "dsagt.commands.proxy_server:main"
dsagt-registry-server = "dsagt.commands.registry_server:main"
dsagt-knowledge-server = "dsagt.commands.knowledge_server:main"
dsagt-setup-kb = "dsagt.commands.setup_core_kb:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "dsagt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsagt = ["py.typed", "tools/*.md", "tools/*.py", "skills/**/*", "dsagt_instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: tests that hit real APIs or start real subprocesses (deselect with -m 'not integration')",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
# torch 2.2.2 (latest available for Intel Mac) was compiled against NumPy 1.x
# and fails to import with NumPy 2.x. Cap numpy on that platform only.
constraint-dependencies = [
    "numpy<2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
