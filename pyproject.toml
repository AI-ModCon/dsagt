[project]
name = "dsagt"
version = "0.1.0"
description = "Data Smith Agent Toolkit - AI-assisted data pipeline builder"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "TBD"}
authors = [
    {name = "BASE-DATA Team", email = "aaron.tuor@pnnl.gov"}
]
keywords = ["data", "pipeline", "agent", "mcp", "ai"]

dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
dsagt-pipeline-server = "dsagt.servers.pipeline_server:main"
dsagt-registry-builder = "dsagt.servers.registry_builder_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsagt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
