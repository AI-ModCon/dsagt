request_preview: is there a way to make the conversion more efficient
request_time: '2026-04-25T05:07:52.244Z'
response_preview: 'The main opportunity is parallelising per-timestep file reads with
  a `ThreadPoolExecutor` — currently all variable files for a step are read sequentially,
  but they''re independent and Lustre handles concurrent I/O well. For 3D channel
  flow (4 × 2.4 GB files per step) this alone could cut read time by ~4×. Layering
  a prefetch pipeline on top — loading step N+1 in background threads while step N
  is being written to HDF5 — hides nearly all I/O latency. The tradeoff is peak memory:
  for 3D, loading all variables for a step simultaneously raises resident memory from
  ~2.4 GB to ~9.6 GB per step, which is fine on HPC nodes but worth controlling with
  a `--num-workers` cap.


  Want me to implement this as v5?'
